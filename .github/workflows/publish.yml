name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@93bdc787fc38a6e5b96888ce272b834545908920 # main
    with:
      # dist/ is generated by esbuild (scripts/build.mjs), not committed, so
      # the publish job has to build before it packs.
      build-for-publish: true
    secrets: inherit
